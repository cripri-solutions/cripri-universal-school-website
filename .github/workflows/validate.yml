name: Validate universal institution website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/universal-institution-manager]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.external = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.capture = True
                      self.external = bool(attrs.get("src"))
                      self.current = []

              def handle_data(self, data):
                  if self.capture and not self.external:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.capture:
                      if not self.external:
                          self.scripts.append("".join(self.current))
                      self.capture = False
                      self.external = False
                      self.current = []

          targets = ["school-website.manager.html", "school.html"]
          failures = []
          checked = 0

          with tempfile.TemporaryDirectory() as tmp:
              for filename in targets:
                  parser = Scripts()
                  parser.feed(Path(filename).read_text(encoding="utf-8"))
                  for index, script in enumerate(parser.scripts, start=1):
                      if not script.strip():
                          continue
                      checked += 1
                      path = Path(tmp) / f"{Path(filename).stem}-{index}.js"
                      path.write_text(script, encoding="utf-8")
                      result = subprocess.run(
                          ["node", "--check", str(path)],
                          capture_output=True, text=True
                      )
                      if result.returncode:
                          failures.append(f"{filename} inline script {index}:\\n{result.stderr}")

          print(f"Checked {checked} inline JavaScript blocks.")
          if failures:
              print("\\n".join(failures))
              raise SystemExit(1)
          print("Inline JavaScript syntax validation passed.")
          PY
